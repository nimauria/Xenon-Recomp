name: Validate module catalog

on:
  push:
    paths:
      - "catalog/modules.json"
      - ".github/workflows/validate-module-catalog.yml"
  pull_request:
    paths:
      - "catalog/modules.json"
      - ".github/workflows/validate-module-catalog.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog schema
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import re

          path = pathlib.Path("catalog/modules.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          assert data.get("schema") == "xenon.module-catalog", "unexpected catalog schema"
          assert data.get("version") == 1, "unsupported catalog version"
          modules = data.get("modules")
          assert isinstance(modules, list), "modules must be an array"

          id_re = re.compile(r"^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$")
          repo_re = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")
          seen = set()

          for index, module in enumerate(modules):
              assert isinstance(module, dict), f"modules[{index}] must be an object"
              module_id = module.get("id", "")
              assert id_re.fullmatch(module_id), f"invalid module id: {module_id!r}"
              assert ".." not in module_id, f"unsafe module id: {module_id!r}"
              assert module_id not in seen, f"duplicate module id: {module_id}"
              seen.add(module_id)

              repository = module.get("repository", "")
              assert repo_re.fullmatch(repository), f"invalid repository for {module_id}: {repository!r}"

              name = module.get("name", "")
              assert isinstance(name, str) and name.strip(), f"missing name for {module_id}"

              assets = module.get("releaseAssets")
              assert isinstance(assets, dict) and assets, f"releaseAssets missing for {module_id}"
              for host, asset in assets.items():
                  assert isinstance(host, str) and host.strip(), f"empty host key for {module_id}"
                  assert isinstance(asset, str) and asset.strip(), f"empty release asset for {module_id}/{host}"
                  assert "/" not in asset and "\\" not in asset, f"asset must be a filename for {module_id}/{host}"

          print(f"Validated {len(modules)} module catalog entries")
          PY
