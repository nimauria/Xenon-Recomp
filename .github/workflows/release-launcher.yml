name: Launcher desktop

on:
  pull_request:
    paths: ["launcher-next/**", ".github/workflows/release-launcher.yml"]
  push:
    branches: [dev, development-restructure]
    paths: ["launcher-next/**", ".github/workflows/release-launcher.yml"]
    tags: ["launcher-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: launcher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: ${{ matrix.os }} desktop
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: launcher-next
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: launcher-next/package-lock.json
      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libcurl4-openssl-dev libx11-dev libgtk-3-0t64 libnss3 libnspr4 libatk-bridge2.0-0t64 libdrm2 libgbm1 libasound2t64 xvfb xauth dbus-x11 fonts-dejavu-core
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install ninja curl
      - name: Install web dependencies and verify translations
        run: |
          npm ci
          npm test
          npm run cef:fetch
      - name: Build desktop
        run: |
          if [[ "$GITHUB_REF" == refs/tags/launcher-v* ]]; then
            version="${GITHUB_REF_NAME#launcher-v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            export XENON_NEXT_VERSION="$version"
          fi
          npm run desktop:build
      - name: Native regression suites
        run: ctest --test-dir build/native --output-on-failure
      - name: Desktop acceptance
        if: runner.os != 'Linux'
        run: npm run test:acceptance
      - name: Sandboxed Linux desktop acceptance
        if: runner.os == 'Linux'
        run: |
          sudo chown root:root build/native/desktop/chrome-sandbox
          sudo chmod 4755 build/native/desktop/chrome-sandbox
          dbus-run-session -- xvfb-run -a npm run test:acceptance
      - name: Package standalone desktop
        run: npm run desktop:package -- --skip-build
      - uses: actions/upload-artifact@v6
        with:
          name: launcher-${{ runner.os }}-${{ runner.arch }}
          path: |
            launcher-next/build/packages/**/*.zip
            launcher-next/build/packages/**/*.tar.gz
            launcher-next/build/packages/**/*.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: launcher-evidence-${{ runner.os }}-${{ runner.arch }}
          path: launcher-next/build/desktop-validation-*/**/*.log
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/launcher-v') && vars.XENON_LAUNCHER_RELEASES_ENABLED == 'true'
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: launcher-*
          path: release-assets
          merge-multiple: true
      - name: Publish validated launcher assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t assets < <(find release-assets -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) | sort)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "${assets[@]}"
